<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Join Loewy for a Raclette &amp; Scotch Party on Friday, December 11.">
  <meta name="theme-color" content="#eee3d3">
  <title>Loewy turning 50!</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="invite">
    <header class="celebration">
      <p class="intro">Join us in celebrating</p>
      <h1 class="birthday-title">Loewy turning <span>50!</span></h1>
      <p class="party-name">Raclette &amp; Scotch Party</p>
      <figure class="party-scene">
        <img
          class="party-photo"
          src="raclette-and-scotch.webp"
          srcset="raclette-and-scotch-small.webp 670w, raclette-and-scotch.webp 1200w"
          sizes="(max-width: 640px) 82vw, 510px"
          alt="Melted raclette in a small grill tray next to a glass of Scotch"
          width="1200"
          height="600"
        >
        <figcaption>Say cheese. Pour Scotch.</figcaption>
      </figure>
    </header>

    <div class="details-panel">
      <section class="event" aria-label="When and where">
        <p class="event-date"><time datetime="2026-12-11">Friday, December 11</time></p>
        <p class="event-time"><time datetime="2026-12-11T18:30:00-07:00">6:30</time> to <time datetime="2026-12-11T22:30:00-07:00">10:30 PM</time></p>
        <p class="event-venue">Loewy’s house</p>
        <p class="event-address">The street address is on your invite.</p>
      </section>

      <section class="reply" aria-label="RSVP" id="rsvp">
        <iframe
          class="rsvp-frame"
          title="RSVP for Loewy’s 50th"
          src="https://docs.google.com/forms/d/e/1FAIpQLScaWOuqjOjZRtuHP-WJ9EhXrUT5Eem7ZE-yrtxDjogGMzCIag/viewform?embedded=true"
          loading="lazy"
        ></iframe>
        <a class="rsvp-link" href="https://docs.google.com/forms/d/e/1FAIpQLScaWOuqjOjZRtuHP-WJ9EhXrUT5Eem7ZE-yrtxDjogGMzCIag/viewform" target="_blank" rel="noopener">Open the RSVP form in a new tab</a>
      </section>
    </div>
  </main>
</body>
</html>
